name: Refresh profile artwork

# Re-reads the public numbers shown on the profile (stars, verified configs,
# proven proxies, Telegram subscribers, contribution calendar) and re-renders
# assets/profile/*.svg. A source that fails keeps its last good value; nothing
# is committed when nothing changed.

on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC (06:47 Tehran)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r tools/profile/requirements.txt

      - name: Fetch live numbers and render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/profile/build.py --fetch

      - name: Verify the render is deterministic
        run: python tools/profile/build.py --check

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- assets/profile; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile
          git commit -m "chore(profile): refresh live numbers [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          echo "::error::Could not push the refreshed artwork."
          exit 1
