<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
<title id="title">Free V2Ray Configs</title>
<desc id="desc">Collect · Test · Publish | Client-ready subscriptions</desc>
<defs>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2=".8">
    <stop stop-color="#155ACB"/><stop offset=".6" stop-color="#1B62D5"/><stop offset="1" stop-color="#1757C8"/>
  </linearGradient>
  <radialGradient id="light" cx=".35" cy="0" r=".9">
    <stop stop-color="#CAE2FF" stop-opacity=".04"/><stop offset="1" stop-color="#CAE2FF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="porcelain" x1="0" y1="0" x2=".35" y2="1">
    <stop stop-color="#F7F9FD"/><stop offset=".55" stop-color="#EFF2F9"/><stop offset="1" stop-color="#C8DBF7"/>
  </linearGradient>
  <filter id="soft" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#12489F" flood-opacity=".32"/>
  </filter>
  <clipPath id="canvas"><rect width="720" height="360" rx="28"/></clipPath>
</defs>
<style>
  .signal { animation: travel 12s linear infinite; }
  @keyframes travel { from { transform: translateX(0); } to { transform: translateX(592px); } }
  @media (prefers-reduced-motion: reduce) { .signal { animation: none; opacity: 0; } }
</style>
<g clip-path="url(#canvas)">
  <rect width="720" height="360" fill="url(#blue)"/>
  <rect width="720" height="360" fill="url(#light)"/>
  <rect x="1" y="1" width="718" height="358" rx="27" fill="none" stroke="#EFF2F9" stroke-opacity=".18"/>
<g transform="translate(102 104) scale(0.78)" filter="url(#soft)"><path d="M-41 27 0-27 41 27M-34 35H34" fill="none" stroke="url(#porcelain)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
